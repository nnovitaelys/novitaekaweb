<!DOCTYPE html>

<html lang="en" dir="ltr">
   <head>
      <meta charset="utf-8">
      <title>Transparent Login Form HTML CSS</title>
      <link rel="stylesheet" href="style.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
   </head>
   <body>
      <div class="bg-img">
         <div class="content">
            <header>Login Form</header>
            <form action="#">
               <div class="field">
                  <span class="fa fa-user"></span>
                  <input type="text" required placeholder="Nama Pengguna">
               </div>
               <div class="field space">
                  <span class="fa fa-lock"></span>
                  <input type="text" class="pass-key required placeholder="Password">
                  <span class="show">SHOW</span>
               </div>
               <div class="field">
                  <input type="submit" value="LOGIN">
               </div>
               <nav class="nav-main">
                  <a href="#collections">Collections</a>
                  <a href="#story">Our Story</a>
                  <a href="#craftsmanship">Craftsmanship</a>
                  <a href="#contact">Visit Us</a>
                  <a href="#contact" class="nav-cta">Book </a>
                  <p id="userInfo">Belum login</p>
                  
                  <div id="authArea">
                     <button onclick="goLogin()" class="nav-cta">Login</button>
               </div>
               </div>
               </div>
      <script>
         const pass_field = document.querySelector('.pass-key');
         const showBtn = document.querySelector('.show');
         showBtn.addEventListener('click', function(){
          if(pass_field.type === "password"){
            pass_field.type = "text";
            showBtn.textContent = "HIDE";
            showBtn.style.color = "#3498db";
          }else{
            pass_field.type = "password";
            showBtn.textContent = "SHOW";
            showBtn.style.color = "#222";
          }
         });
      </script>
                  <script src="templatemo-maison-doree.js"></script>
                  form id="loginForm">
                  <h3>Silahkan Login</h3>
                  <label for="username">Nama Pengguna</label>
                  <input type="text" id="username" placeholder="Nama Pengguna.." required="required">
                  
                  <label for="password">Password</label>
                  <input type="password" id="password" placeholder="Password required="required">
                  <!-- <p id="message"></p> -->
                  <button type="submit" >masuk</button>
                  
                  <div class="social">
                     <div class="go"> <a href="register.html">DAFTAR </a></div>
                     <div class="kanan"><i class="fab fa-google"></i> Google</div>
                  </div>
                  <button onclick="location.href='../index.html';">Home</button>
                  <div id="alertBox" class="alert" style="display:none;"></div>
            </form>
         </footer>
         <script src="template 3D Coverflow.All rights reserved.js"></script>
            <script src="login/js/welcome.js"></script>    
   </body>
