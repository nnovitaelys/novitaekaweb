<!DOCTYPE html>
<!-- Created By CodingNepal -->
<html lang="en" dir="ltr">
   <head>
      <meta charset="utf-8">
      <title>Transparent Login Form HTML CSS</title>
      <link rel="stylesheet" href="css/style.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
   </head>
   <body>
      <div class="bg-img">
         <div class="content">
            <header>Login Form</header>
            <form id="loginForm" action="javascript:void(0);">
               <div class="field">
                  <span class="fa fa-user"></span>
                  <input type="text" id="username" required placeholder="Nama Pengguna">
               </div>
               <div class="field space">
                  <span class="fa fa-lock"></span>
                  <input type="password" id="password" class="pass-key" required placeholder="password">
                  <span class="show">SHOW</span>
               </div>
               <div class="field">
                  <input type="submit" value="LOGIN">
               </div>
            </form>
            <div id="alertBox" style="display:none;color:red;"></div>
               <nav class="nav-main">
                  <a href="#collections">Collections</a>
                  <a href="#story">Our Story</a>
                  <a href="#craftsmanship">Craftsmanship</a>
                  <a href="#contact">Visit Us</a>
                  <a href="#contact" class="nav-cta">Book </a>
                  <p id="userInfo">Belum login</p>
               </div>
               </div>
      <script>
         const pass_field = document.querySelector('.pass-key');
         const showBtn = document.querySelector('.show');
         showBtn.addEventListener('click', function(){
          if(pass_field.type === "password"){
            pass_field.type = "text";
            showBtn.textContent = "HIDE";
            showBtn.style.color = "#3498db";
          }else{
            pass_field.type = "password";
            showBtn.textContent = "SHOW";
            showBtn.style.color = "#222";
          }
         });
      </script>
                  <script src="templatemo-maison-doree.js"></script>
                  
            <script src="js/login.js"></script>    
   </body>
</html>
